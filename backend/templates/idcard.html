<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 400px;
            height: 250px;
        }

        .card {
            width: 380px;
            height: 230px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .card-header {
            background: linear-gradient(135deg, #1a3c5e, #2d6a9f);
            color: white;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header .org-name {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .card-header .org-tagline {
            font-size: 9px;
            opacity: 0.85;
            margin-top: 2px;
        }

        .card-body {
            display: flex;
            padding: 14px 16px;
            gap: 14px;
            flex: 1;
        }

        .photo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .photo {
            width: 80px;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid #1a3c5e;
        }

        .photo-placeholder {
            width: 80px;
            height: 90px;
            background: #e0e0e0;
            border-radius: 6px;
            border: 2px solid #1a3c5e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #999;
        }

        .info-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
        }

        .badge {
            display: inline-block;
            background: #1a3c5e;
            color: white;
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: fit-content;
            margin-bottom: 4px;
        }

        .name {
            font-size: 15px;
            font-weight: bold;
            color: #1a3c5e;
        }

        .detail {
            font-size: 10px;
            color: #555;
            margin-top: 1px;
        }

        .detail span {
            font-weight: bold;
            color: #333;
        }

        .card-footer {
            background: #f7f7f7;
            border-top: 1px solid #eee;
            padding: 6px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .id-number {
            font-size: 9px;
            color: #888;
            font-family: monospace;
            letter-spacing: 1px;
        }

        .valid {
            font-size: 9px;
            color: #2d6a9f;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div>
                <div class="org-name">TOKIMI FOUNDATION</div>
                <div class="org-tagline">Empowering Students Through Computer Literacy</div>
            </div>
        </div>

        <div class="card-body">
            <div class="photo-section">
                {{#if photo_url}}
                <img class="photo" src="{{photo_url}}" alt="Photo"/>
                {{else}}
                <div class="photo-placeholder">No Photo</div>
                {{/if}}
            </div>

            <div class="info-section">
                <div class="badge">{{type}}</div>
                <div class="name">{{first_name}} {{last_name}}</div>
                <div class="detail">{{role_or_batch}}</div>
                <div class="detail">{{department_or_year}}</div>
                <div class="detail">Email: <span>{{email}}</span></div>
                <div class="detail">Phone: <span>{{phone}}</span></div>
            </div>
        </div>

        <div class="card-footer">
            <div class="id-number">ID: TKF-{{id}}-{{year}}</div>
            <div class="valid">VALID 2024 - 2025</div>
        </div>
    </div>
</body>
</html>
